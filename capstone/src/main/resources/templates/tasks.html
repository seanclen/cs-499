<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout_fragments :: common_head('Tasks')}"></head>
<body class="tasks">

    <div th:replace="~{fragments/layout_fragments :: site_header}"></div>

    <div id="message-container" class="message-container">
        <p th:if="${message}" th:text="${message}" class="message message-success"></p>
        <p th:if="${error}" th:text="${error}" class="message message-error"></p>
    </div>
    
    <main class="container">
        <div class="inline-title">
            <h1>Tasks</h1>
            <a th:href="@{/tasks/new}" type="button">Add New Contact</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.id}">1</td>
                    <td th:text="${task.name}">Sample Task</td>
                    <td th:text="${task.description}">This is a sample task description.</td>
                    
                    <td class="actions">
                        <a th:href="@{/tasks/{id}(id=${task.id})}" type="button">Edit</a>
                        
                        <form th:action="@{/tasks/{id}(id=${task.id})}" method="post" style="display: inline;">
                            <input type="hidden" name="_method" value="delete" /> 
                            <button type="submit" onclick="return confirm('Are you sure you want to delete this task?')">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <div th:replace="~{fragments/layout_fragments :: site_footer}"></div>

</body>
</html>
